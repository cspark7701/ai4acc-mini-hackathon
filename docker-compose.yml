# ==============================================================================
# docker-compose.yml — AI Applications in Accelerators Tutorial & Mini-Hackathon
# KOMAC / KAERI
# ==============================================================================

services:
  ai4acc:
    build:
      context: .
      dockerfile: Dockerfile
    image: ai4acc-hackathon-2026:latest
    container_name: ai4acc-hackathon-2026
    ports:
      - "8888:8888"
    volumes:
      # Mount ONLY the participant notebook and src so changes made inside Jupyter persist on your host
      # while keeping the reference solution notebook isolated and private
      - ./notebooks/Single_Notebook_Beam_Orbit_Predictor_Participant.ipynb:/workspace/notebooks/Single_Notebook_Beam_Orbit_Predictor_Participant.ipynb
      - ./src:/workspace/src
    environment:
      - WANDB_API_KEY=${WANDB_API_KEY:-}
    restart: unless-stopped
