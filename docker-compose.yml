# ==============================================================================
# docker-compose.yml — AI Applications in Accelerators Tutorial & Mini-Hackathon
# ==============================================================================

services:
  ai4acc:
    build:
      context: .
      dockerfile: Dockerfile
    image: cspark7701/ai4acc-hackathon-2026:latest
    container_name: ai4acc-hackathon-2026
    ports:
      - "127.0.0.1:8888:8888"  # local only: Jupyter has no token, so never expose it to the network
    volumes:
      # Mount ONLY the participant notebook and src so changes made inside Jupyter persist on your host
      # while keeping the reference solution notebook isolated and private
      # (the image places the notebook directly in /workspace)
      - ./notebooks/Single_Notebook_Beam_Orbit_Predictor_Participant.ipynb:/workspace/Single_Notebook_Beam_Orbit_Predictor_Participant.ipynb
      - ./src:/workspace/src
    environment:
      - WANDB_API_KEY=${WANDB_API_KEY:-}
    restart: "no"  # stop with Ctrl+C / docker compose down; do not restart JupyterLab after a reboot
